name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Verified main commit to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require the verified release revision
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.16.0
      - name: Download package from successful push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --limit 100 \
            --json databaseId,headSha,headBranch,event,conclusion | \
            jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha and .headBranch == "main" and .event == "push" and .conclusion == "success")][0].databaseId // empty')
          test -n "$run_id" || { echo 'No successful main push CI run for this commit' >&2; exit 1; }
          gh run download "$run_id" --name npm-package --dir artifacts/npm-pack
      - name: Verify and publish tested package
        run: |
          tarball=$(node scripts/package-receipt.mjs verify artifacts/npm-pack "$GITHUB_SHA")
          npm publish "$tarball" --access public --provenance --tag beta
