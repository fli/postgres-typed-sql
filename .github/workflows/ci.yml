name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: typed_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TYPED_SQL_TEST_URL: postgres://postgres:postgres@localhost:5432/typed_sql_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:engine
      - run: node --test scripts/package-receipt.test.mjs
      - run: pnpm test:all
      - run: node scripts/package-receipt.mjs create artifacts/npm-pack "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            artifacts/npm-pack/*.tgz
            artifacts/npm-pack/receipt.json
          if-no-files-found: error

  node-20-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm-pack
      - run: |
          tarball=$(node scripts/package-receipt.mjs verify artifacts/npm-pack "$GITHUB_SHA")
          node scripts/node-compatibility-check.mjs "$tarball"
